# Publishes a release when a version tag is pushed:
#   git tag v1.2.3 && git push origin v1.2.3
# The release carries the Linux binaries, release.json (Sideyard's update
# check reads it), SHA256SUMS and install.sh, so servers install with
#   curl -fsSL https://github.com/rabeeh-ta/sideyard/releases/latest/download/install.sh | sudo bash
# The repository must be public for servers to download releases.
#
# Servers run what this publishes as root, so the job that runs npm and Go
# builds has a read-only token, and only the small publish job can write.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make web test

      - name: Build
        run: make release VERSION=${{ github.ref_name }} SOURCE=${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/sideyard-linux-amd64
            dist/sideyard-linux-arm64
            dist/release.json
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease --repo "$REPO" --generate-notes \
            dist/sideyard-linux-amd64 dist/sideyard-linux-arm64 dist/release.json dist/SHA256SUMS dist/install.sh
