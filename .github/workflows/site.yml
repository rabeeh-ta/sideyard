# Publishes site/, the landing page, to GitHub Pages when it changes on master.
# The repository's Pages source must be "GitHub Actions" (Settings → Pages).
# site/ is served as committed; its prompts must be current (make site).
name: Site

on:
  push:
    branches: [master]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check prompts
        run: scripts/prompts.sh --check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
